<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodexPro Profile Bridge</title>
  <style>
    body{font:14px system-ui,sans-serif;width:290px;margin:0;padding:16px;background:#111318;color:#f5f7fb}
    h1{font-size:16px;margin:0 0 12px}.card{background:#1b1f27;border:1px solid #303744;border-radius:12px;padding:12px}
    #label{font-weight:700;overflow-wrap:anywhere}#email,#status{font-size:12px;color:#aeb7c5;margin-top:5px;overflow-wrap:anywhere}
    button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#39d98a;color:#07130d}
    button.active{background:#ffb020;color:#211300}button:disabled{opacity:.55;cursor:wait}.hint{font-size:11px;color:#8e98a8;margin-top:10px;line-height:1.4}
  </style>
</head>
<body>
  <h1>CodexPro Profile Bridge</h1>
  <div class="card">
    <div id="label">Đang đọc profile…</div>
    <div id="email"></div>
    <div id="status">Bridge: đang kiểm tra</div>
    <button id="activate" disabled>ACTIVE PROFILE NÀY</button>
  </div>
  <div class="hint">Chỉ profile có trạng thái ACTIVE mới được CodexPro điều khiển. Bấm nút ở profile khác để chuyển quyền.</div>
  <script src="popup.js"></script>
</body>
</html>
