name: Build CodexPro Local

on:
  workflow_dispatch:
  push:
    branches:
      - ci/self-hosted-runner
    paths:
      - .github/workflows/build-codexpro-local.yml

jobs:
  build-local:
    name: Build CodexPro on local PC
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CodexPro
        run: npm run build

      - name: Pack CodexPro
        shell: powershell
        run: |
          $package = (npm pack --silent | Select-Object -Last 1).Trim()
          if (-not (Test-Path $package)) { throw 'npm pack did not create a package.' }

          $dest = Join-Path $env:LOCALAPPDATA 'CodexProBuild'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Copy-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'dist') (Join-Path $dest 'dist')
          Copy-Item -Force $package (Join-Path $dest $package)

          @(
            "repository=$env:GITHUB_REPOSITORY"
            "branch=$env:GITHUB_REF_NAME"
            "commit=$env:GITHUB_SHA"
            "package=$package"
            "built_at=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Encoding utf8 (Join-Path $dest 'build-info.txt')

          Write-Host "CODEXPRO_BUILD dist=PASS package=$package destination=$dest"

