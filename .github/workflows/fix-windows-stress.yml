name: Fix Windows Stress Source

on:
  push:
    branches:
      - ci/self-hosted-runner
    paths:
      - .github/run-stress-source-fix

permissions:
  contents: write

jobs:
  fix:
    name: Patch and verify Windows stress path
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Apply source fix
        run: node scripts/apply-windows-stress-fix.mjs

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke Test
        run: npm run smoke

      - name: Stress Test on Windows
        run: npm run stress

      - name: Check Package Contents
        run: npm pack --dry-run

      - name: Commit verified source fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bashOps.ts
          if (git diff --cached --quiet) { throw "No verified source change to commit." }
          git commit -m "Fix quoted Windows executable invocation"
          git push origin HEAD:ci/self-hosted-runner
