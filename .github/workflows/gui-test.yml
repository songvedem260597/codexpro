name: Install Actions Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - ci/self-hosted-runner
    paths:
      - .github/run-monitor-install

jobs:
  install:
    name: Install GitHub Actions Monitor on local PC
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Build monitor
        shell: powershell
        run: |
          $sample = Join-Path $env:GITHUB_WORKSPACE 'tests\electron-gui-sample'
          Push-Location $sample
          npm install --no-audit --no-fund
          npm run package:win
          Pop-Location

      - name: Install monitor locally
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'tests\electron-gui-sample\dist\CodexProActionsMonitor-win32-x64'
          $installDir = Join-Path $env:LOCALAPPDATA 'CodexProActionsMonitor'
          $exe = Join-Path $installDir 'CodexProActionsMonitor.exe'

          Get-Process CodexProActionsMonitor -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500

          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $installDir -Recurse -Force

          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcutPath = Join-Path $desktop 'CodexPro Actions Monitor.lnk'
          $wshell = New-Object -ComObject WScript.Shell
          $shortcut = $wshell.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = $exe
          $shortcut.WorkingDirectory = $installDir
          $shortcut.Description = 'Monitor GitHub Actions for CodexPro'
          $shortcut.Save()

          if (-not (Test-Path $exe)) { throw 'Installed monitor executable was not found.' }
          Write-Host 'MONITOR_INSTALL installed=PASS shortcut=PASS'

      - name: Launch installed monitor
        shell: powershell
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'CodexProActionsMonitor'
          $exe = Join-Path $installDir 'CodexProActionsMonitor.exe'
          $marker = Join-Path $env:RUNNER_TEMP 'codexpro-actions-monitor-ready.txt'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:CODEXPRO_ELECTRON_TEST_MARKER = $marker
          Start-Process -FilePath $exe -WorkingDirectory $installDir

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $marker) {
              $ready = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw 'Monitor window did not reach ready-to-show.' }
          Write-Host 'MONITOR_LAUNCH window_ready=PASS'

      - name: Clean build cache only
        if: always()
        shell: powershell
        run: |
          Remove-Item -Force "$env:RUNNER_TEMP\codexpro-actions-monitor-ready.txt" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\tests\electron-gui-sample\node_modules" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\tests\electron-gui-sample\dist" -ErrorAction SilentlyContinue
