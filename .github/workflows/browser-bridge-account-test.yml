name: Browser Bridge Account Smoke

on:
  push:
    branches:
      - codex/worker-plugin-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-smoke:
    runs-on: [self-hosted, Windows, X64, codexpro-local]
    timeout-minutes: 15

    steps:
      - name: Checkout worker bridge branch
        uses: actions/checkout@v4

      - name: Verify runtime prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          npm --version
          if (-not (Test-Path 'chrome-extension\manifest.json')) {
            throw 'chrome-extension is missing on this branch.'
          }

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Build CodexPro
        shell: powershell
        run: npm run build

      - name: Check existing local profile bridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:9224/' -TimeoutSec 3
            Write-Host "Bridge root responded with HTTP $($response.StatusCode)"
          } catch {
            Write-Host 'No bridge root response yet. This is expected if CodexPro manager/runtime is not currently running.'
          }

          try {
            $health = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:9224/health' -TimeoutSec 3
            Write-Host "Bridge health responded with HTTP $($health.StatusCode)"
          } catch {
            Write-Host 'Bridge health endpoint is not reachable yet.'
          }

      - name: Run browser bridge unit smoke tests
        shell: powershell
        run: |
          node scripts/browser-agent-smoke.mjs
          node scripts/network-stream-capture-smoke.mjs
          node scripts/domless-send-smoke.mjs

      - name: Instructions
        shell: powershell
        run: |
          Write-Host 'Browser bridge build/smokes passed.'
          Write-Host 'For the real account test, keep the normal Chrome profile open, open the CodexPro Profile Bridge popup, and select ACTIVE PROFILE NAY.'
          Write-Host 'Developer Mode and ChatGPT plugin installation are not required for this browser-bridge path.'
